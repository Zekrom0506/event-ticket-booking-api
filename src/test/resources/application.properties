# Settings used only while running tests.
# Tests use a separate database so they never touch real data.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketdb_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# create the tables when tests start and drop them at the end
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm
jwt.expiration-ms=3600000
