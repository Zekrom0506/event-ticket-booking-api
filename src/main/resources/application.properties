spring.application.name=ticket-booking-api
server.port=8080

# Database settings. The defaults work for a local PostgreSQL,
# and the environment variables are used when running in Docker / on the server.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Let Hibernate create/update the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
